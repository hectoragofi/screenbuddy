[package]
name = "screenbuddy"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
katex-native = { version = "0.1.1", features = ["raster"] }
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false, features = ["text"] }
rquickjs = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tiny-skia = "0.12.0"
toml = "1.1.8"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_Security", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Time", "Win32_Media_Audio"] }
winreg = "0.56.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
